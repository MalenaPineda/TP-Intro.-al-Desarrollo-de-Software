services:
  convivencia-api:
    image: "backend"
    build: . # Buildear el Dockerfile de esta carpeta (.)
    ports:
      - "8000:8000"
    env_file:
      - .env

  db:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql

