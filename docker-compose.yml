services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./app/src/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  convivencia-api:
    depends_on:
      - db
    image: "backend"
    build: .
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    volumes:
      - ./app:/app
      - /app/node_modules
  db:
    image: postgres:18
    env_file:
      - app/.env
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql
      - ./app/db/schemas.sql:/docker-entrypoint-initdb.d/01_schemas.sql:ro
      - ./app/db/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
