services:
  convivencia-api:
    image: "backend"
    build: . # Buildear el Dockerfile de esta carpeta (.)
    ports:
      - "8000:8000"
    env_file:
      - app/.env

  db:
    image: postgres:18
    env_file:
      - app/.env
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./app/db/schemas.sql:/docker-entrypoint-initdb.d/schemas.sql:ro

