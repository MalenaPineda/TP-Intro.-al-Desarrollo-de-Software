<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoLiving – Ingresar gastos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="house-name">Casa Feliz</div>
          <div class="members" id="cantidad-miembros">4 miembros</div>
        </div>
        <nav class="sidebar-menu">
          <a href="dashboard.html" class="sidebar-item"><i class="fa-solid fa-house"></i> Página principal</a>
          <a href="ver_gastos.html" class="sidebar-item"><i class="fa-solid fa-dollar-sign"></i> Gastos</a>
          <a href="tareas.html" class="sidebar-item"><i class="fa-solid fa-list-check"></i> Tareas</a>
          <a href="ranking.html" class="sidebar-item"><i class="fa-solid fa-trophy"></i>Ranking</a>
          <a href="insignias.html" class="sidebar-item"><i class="fa-solid fa-square-plus"></i>Crear insignia</a>
          <a href="miembros.html" class="sidebar-item"><i class="fa-solid fa-users"></i> Miembros</a>
      </nav>
        <div class="sidebar-user" id="selector-usuario">
          <div class="avatar" id="user-avatar">M</div>
          <div class="user-info">
            <div class="name" id="user-name">Malena</div>
            <div class="role">Cambiar usuario ▾</div>
          </div>
        </div>
        <div id="user-dropdown" class="user-dropdown"></div>
    </aside>
    <main class="main-content">
    <div class="container is-max-desktop p-5">
        <a href="ver_gastos.html" class="has-text-grey is-size-6 is-flex is-align-items-center mb-5">
            <span class="icon mr-2"><i class="fa-solid fa-arrow-left"></i></span> Volver a gastos
        </a>
        <h2 class="title is-3 mb-2 has-text-black">Registrar gasto</h2>
        <p class="subtitle is-6 has-text-grey mb-6">Añade un gasto compartido de la casa</p>
        <form id="datos-gastos">
        <div class="box p-6 has-background-white is-shadowless" style="border: 1px solid #e2e8f0; border-radius: 20px;">
            <div class="field mb-5">
                <label class="label has-text-grey-dark has-text-weight-normal">Nombre del gasto</label>
                <div class="control">
                    <input class="input is-medium" name="descripcion" type="text" placeholder="ej. Compra del supermercado" style="border-radius: 10px;">
                </div>
            </div>
            <div class="columns mb-5">
              <div class="column">
                <div class="field">
                  <label class="label has-text-grey-dark has-text-weight-normal">Categoría</label>
                  <div class="control is-expanded">
                    <div class="select is-fullwidth is-medium">
                      <select name="categoria" id="categoria" style="border-radius: 10px;">
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <div class="column">
                <div class="field">
                  <label class="label has-text-grey-dark has-text-weight-normal">Monto ($)</label>
                  <div class="control">
                    <input class="input is-medium" name="monto" type="number" min="1" value="0" style="border-radius: 10px;">
                  </div>
                </div>
              </div>
              <div class="column">
                <div class="field">
                  <label class="label has-text-grey-dark has-text-weight-normal">Método de pago</label>
                  <div class="control is-expanded">
                    <div class="select is-fullwidth is-medium">
                      <select name="metodo-pago" id="metodo-pago" style="border-radius: 10px;">
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="field">
              <div class="control">
                <button class="button is-cyan is-fullwidth is-medium py-5" name="btn-registrar" type="submit" style="border-radius: 10px;">
                  <span class="icon mr-2">
                    <i class="fa-solid fa-circle-plus"></i>
                  </span>
                  <span class="has-text-weight-medium">Registrar gasto</span>
                </button>
              </div>
            </div>
        </div>
        </form>
    </div>
    </main>
</div>
<script src="js/comun.js"></script>
<script src="js/ingresar_gastos.js"></script>
</body>
</html>
