<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoLiving – Miembros</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="house-name">Casa Feliz</div>
      <div class="members" id="cantidad-miembros">4 miembros</div>
    </div>
    <nav class="sidebar-menu">
      <a href="dashboard" class="sidebar-item"><i class="fa-solid fa-house"></i> Página principal</a>
      <a href="ver_gastos" class="sidebar-item"><i class="fa-solid fa-dollar-sign"></i> Gastos</a>
      <a href="tareas" class="sidebar-item"><i class="fa-solid fa-list-check"></i> Tareas</a>
      <a href="ranking" class="sidebar-item"><i class="fa-solid fa-trophy"></i>Ranking</a>
      <a href="miembros" class="sidebar-item active"><i class="fa-solid fa-users"></i> Miembros</a>
    </nav>
    <div class="sidebar-user" id="selector-usuario">
      <div class="avatar" id="user-avatar">M</div>
      <div class="user-info">
        <div class="name" id="user-name">Malena</div>
        <div class="role">Cambiar usuario ▾</div>
      </div>
    </div>
    <div id="user-dropdown" class="user-dropdown"></div>
  </aside>

  <main class="main-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Miembros de la casa</h1>
        <p class="page-subtitle">Administrar los integrantes del hogar</p>
      </div>
    </div>

    <div class="panel-card" style="margin-bottom: 1.5rem;">
      <div class="panel-title">
        <i class="fa-solid fa-circle-plus" style="color: var(--teal);"></i> Nuevo miembro
      </div>

      <form id="form-crear-miembro">

        <div class="field mb-4">
          <label class="label has-text-grey-dark has-text-weight-normal">Nombre</label>
          <div class="control">
            <input class="input is-medium" name="nombre" type="text" placeholder="ej. Juan Pérez" required />
          </div>
        </div>

        <div class="columns mb-4">

          <div class="column">
            <div class="field">
              <label class="label has-text-grey-dark has-text-weight-normal">Email</label>
              <div class="control">
                <input class="input is-medium" name="email" type="email" placeholder="ej. juan@correo.com" required />
              </div>
            </div>
          </div>

          <div class="column">
            <div class="field">
              <label class="label has-text-grey-dark has-text-weight-normal">Contraseña</label>
              <div class="control">
                <input class="input is-medium" name="contrasenia" type="password" placeholder="Contraseña simbolica" required />
              </div>
            </div>
          </div>

          <div class="column">
            <div class="field">
              <label class="label has-text-grey-dark has-text-weight-normal">Fecha de nacimiento</label>
              <div class="control">
                <input class="input is-medium" name="fecha_nacimiento" type="date" />
                <p class="help">Edad mínima: 15 años</p>
              </div>
            </div>
          </div>

        </div>

        <div class="field">
          <div class="control">
            <button class="button is-fullwidth is-medium py-5" type="submit">
              <span class="icon mr-2"><i class="fa-solid fa-circle-plus"></i></span>
              <span>Agregar miembro</span>
            </button>
          </div>
        </div>

      </form>
    </div>

    <div class="panel-card">
      <div class="panel-title">
        <i class="fa-solid fa-list" style="color: var(--accent);"></i> Todos los miembros
      </div>
      <div id="lista-miembros"></div>
    </div>

  </main>
</div>

<div id="toast" class="toast"></div>
<script src="js/comun.js"></script>
<script src="js/miembros.js"></script>
</body>
</html>
