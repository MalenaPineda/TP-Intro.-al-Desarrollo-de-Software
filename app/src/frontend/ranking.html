<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>CoLiving – Ranking de Tareas</title>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="house-name">Casa Feliz</div>
            <div class="members" id="cantidad-miembros">4 miembros</div>
        </div>
        <nav class="sidebar-menu">
            <a href="dashboard" class="sidebar-item"><i class="fa-solid fa-house"></i> Página principal</a>
            <a href="ver_gastos" class="sidebar-item"><i class="fa-solid fa-dollar-sign"></i> Gastos</a>
            <a href="tareas" class="sidebar-item"><i class="fa-solid fa-list-check"></i> Tareas</a>
            <a href="ranking" class="sidebar-item active"><i class="fa-solid fa-trophy"></i>Ranking</a>
            <a href="miembros" class="sidebar-item"><i class="fa-solid fa-users"></i> Miembros</a>
        </nav>
        <div class="sidebar-user" id="selector-usuario">
            <div class="avatar" id="user-avatar">M</div>
            <div class="user-info">
                <div class="name" id="user-name">Malena</div>
                <div class="role">Cambiar usuario ▾</div>
            </div>
        </div>
        <div id="user-dropdown" class="user-dropdown"></div>
    </aside>
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title">Ranking de tareas</h1>
                <p class="page-subtitle">¿Quién completó más tareas del hogar?</p>
            </div>
        </header>
        <section class="bottom-grid">
            <div class="panel-card" style="grid-column: 1 / -1;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem;">
                    <h3 class="panel-title" style="margin-bottom: 0;">Tareas completadas por usuario</h3>
                </div>
                <div id="lista-ranking"></div>
            </div>
        </section>
    </main>
    <script src="js/comun.js"></script>
<script src="js/ranking.js"></script>
</body>
</html>
