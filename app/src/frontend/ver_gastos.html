<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convivencia – Expenses</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-layout">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="house-name">Casa Feliz</div>
      <div class="members">4 miembros</div>
    </div>

    <nav class="sidebar-menu">
      <a href="/dashboard" class="sidebar-item">
        <i class="fa-solid fa-house"></i> Dashboard
      </a>
      <a href="/tasks" class="sidebar-item">
        <i class="fa-solid fa-check-square"></i> Tasks
        <span class="badge">1</span>
      </a>
      <a href="/expenses" class="sidebar-item active">
        <i class="fa-solid fa-dollar-sign"></i> Expenses
        <span class="badge">2</span>
      </a>
      <a href="/ranking" class="sidebar-item">
        <i class="fa-solid fa-trophy"></i> Ranking
      </a>
      <a href="/admin" class="sidebar-item">
        <i class="fa-solid fa-shield-halved"></i> Admin
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="avatar">JD</div>
      <div class="user-info">
        <div class="name">Juan Díaz</div>
        <div class="role">Admin</div>
      </div>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <main class="main-content">

    <!-- Page header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Expenses</h1>
        <p class="page-subtitle">Gastos compartidos de la casa</p>
      </div>
      <!-- EJS: href="/expenses/new" -->
      <a href="/expenses/new" class="btn-add">
        <i class="fa-solid fa-circle-plus"></i> Agregar gasto
      </a>
    </div>

    <!-- Summary cards -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">Este mes</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Este mes</div>
      </div>
    </div>

    <!-- Bottom grid -->
    <div class="bottom-grid">

      <!-- Por categoría -->
      <div class="panel-card">
        <div class="panel-title">Por categoría</div>
        <div class="chart-wrap">
          <canvas id="donut"></canvas>
          <!-- EJS: <% categories.forEach(c => { %> -->
          <div class="legend">
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--c-groceries)"></span>
              <span class="legend-name">Groceries</span>
              <span class="legend-amount">$312</span>
              <span class="legend-pct">(36%)</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--c-utilities)"></span>
              <span class="legend-name">Utilities</span>
              <span class="legend-amount">$320</span>
              <span class="legend-pct">(37%)</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--c-cleaning)"></span>
              <span class="legend-name">Cleaning</span>
              <span class="legend-amount">$90.3</span>
              <span class="legend-pct">(10%)</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--c-internet)"></span>
              <span class="legend-name">Internet</span>
              <span class="legend-amount">$80</span>
              <span class="legend-pct">(9%)</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot" style="background:var(--c-other)"></span>
              <span class="legend-name">Other</span>
              <span class="legend-amount">$60</span>
              <span class="legend-pct">(7%)</span>
            </div>
          </div>
          <!-- EJS: <% }) %> -->
        </div>
      </div>

      <!-- Transacciones recientes -->
      <div class="panel-card">
        <div class="panel-title">Transacciones recientes</div>
          <div id="lista-gastos">HOLA</div>
      </div>
    </div>
  </main>
</div>

<!-- Chart.js para el donut -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/ver_gastos.js"></script>
</body>
</html>
