<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <!-- 1. FONT AWESOME (íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- estilos generales-->
    <link rel="stylesheet" href="css/style.css">

    <title>CoLiving – Página principal</title>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="house-name">Casa Feliz</div>
            <div class="members" id="cantidad-miembros">4 miembros</div>
        </div>
        <nav class="sidebar-menu">
            <a href="dashboard.html" class="sidebar-item"><i class="fa-solid fa-house"></i> Página principal</a>
            <a href="ver_gastos.html" class="sidebar-item"><i class="fa-solid fa-dollar-sign"></i> Gastos</a>
            <a href="tareas.html" class="sidebar-item"><i class="fa-solid fa-list-check"></i> Tareas</a>
            <a href="ranking.html" class="sidebar-item"><i class="fa-solid fa-trophy"></i>Ranking</a>
            <a href="insignias.html" class="sidebar-item"><i class="fa-solid fa-square-plus"></i>Crear insignia</a>
            <a href="miembros.html" class="sidebar-item"><i class="fa-solid fa-users"></i> Miembros</a>
        </nav>
        <div class="sidebar-user" id="selector-usuario">
            <div class="avatar" id="user-avatar">M</div>
            <div class="user-info">
                <div class="name" id="user-name">Malena</div>
                <div class="role">Cambiar usuario ▾</div>
            </div>
        </div>
        <div id="user-dropdown" class="user-dropdown"></div>
    </aside>
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title">¡Bienvenido de nuevo!</h1>
                <p class="house-title" id="house-name">Casa Feliz</p>
            </div>
            
            <div id="current-date"></div>
        </header>
    <section class="summary-grid">
    <div class="summary-card">
        <p class="summary-label">Tareas pendientes</p>
        <h2 class="summary-value blue" id="pending-tasks">...</h2>
    </div>
    <div class="summary-card">
        <p class="summary-label">Gastos del mes</p>
        <h2 class="summary-value teal" id="gasto-mes">...</h2>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;"
        >Tu parte: <span id="gasto-user">...</span></p>
    </div>
    <div class="summary-card">
        <p class="summary-label">Tus tareas</p>
        <h2 class="summary-value purple" id="my-tasks">
        </h2>
    </div>
    </section> 

     <section class="panel-card" style="margin-bottom: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem;">
            <h3 class="panel-title" style="margin-bottom: 0;">Próximas a vencer</h3>
        </div>
        <div class="task-list" id="lista-proximas-a-vencer"></div>
    </section>

    <section class="bottom-grid">
        
        <div class="panel-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem;">
                <h3 class="panel-title" style="margin-bottom: 0;">Tareas asignadas</h3>
                <a href="tareas.html" style="font-size: 0.8rem; color: var(--c-utilities); text-decoration: none;">Ver todas</a>
            </div>
            
        <div class="task-list" id="lista-tareas-asignadas"></div>
        </div> 

        <div class="panel-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem;">
                <h3 class="panel-title" style="margin-bottom: 0;">Gastos recientes</h3>
                <a href="ver_gastos.html" style="font-size: 0.8rem; color: var(--c-utilities); text-decoration: none;">Ver todos</a>
                
            </div>

            <div class="expense-list" id="lista-gastos">
        
            </div>
        </div>

    </section>
    </main>
</div>
    <script src="js/comun.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
